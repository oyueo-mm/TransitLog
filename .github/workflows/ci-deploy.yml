name: CI & Deploy

# main 에 push 하면 검사 → 빌드 → GitHub Pages 배포. PR 에서는 검사만 한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_COLOR: '0'

jobs:
  test:
    name: 개인정보 검사 · 타입 · 단위 · 빌드 · 브라우저 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이력 전체를 개인정보 검사 대상에 포함

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 개인 데이터 파일(PDF·백업·이관 JSON·private/)이 저장소 또는 이력에 있으면 실패
      - name: 개인정보 검사 (경로·이력)
        run: node scripts/check-privacy.mjs --history

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npx oxlint

      - name: 단위 테스트 (Vitest)
        run: npm test

      - name: 빌드 (/TransitLog/)
        run: npm run build

      - name: 개인정보 검사 (배포 산출물)
        run: node scripts/check-privacy.mjs --dist

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 브라우저 테스트 (360px 모바일·데스크톱·PWA·오프라인·백업·이관)
        run: npx playwright test

      - name: 실패 시 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Pages 아티팩트 준비
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: GitHub Pages 배포
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
